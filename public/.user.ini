; Limites d'upload appliquées à la racine web (dossier www/ chez OVH).
;
; PHP lit ce fichier .user.ini directement dans la racine web : c'est le
; mécanisme fiable sur un hébergement mutualisé, là où un php.ini placé à la
; racine du PROJET peut être ignoré. Les valeurs doivent rester identiques à
; celles du php.ini du projet.
;
; ⚠️ PHP met ce fichier en cache ~5 minutes (user_ini.cache_ttl) : après
; modification, la nouvelle valeur peut mettre quelques minutes à s'appliquer.

; Taille maximale d'UNE photo envoyée.
upload_max_filesize = 8M

; Taille maximale de TOUTE la requête. Doit rester nettement supérieure à
; upload_max_filesize, sinon une photo proche de 8 Mo ne passe pas seule.
post_max_size = 24M

; Nombre maximum de fichiers par requête. Sans cette ligne, PHP retombe sur sa
; valeur par défaut (20) et jette SILENCIEUSEMENT les fichiers en trop.
max_file_uploads = 30
