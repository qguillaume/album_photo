; Taille maximale d'UNE photo envoyée.
upload_max_filesize = 8M

; Taille maximale de TOUTE la requête (l'enveloppe qui transporte les fichiers).
; Doit rester nettement supérieure à upload_max_filesize, sinon une photo
; proche de 8 Mo ne passe pas, même envoyée seule.
post_max_size = 24M

; Nombre maximum de fichiers par requête. Sans cette ligne, PHP retombe sur
; sa valeur par défaut (20) et jette SILENCIEUSEMENT les fichiers en trop :
; c'est ce qui limitait le multipostage à 20 photos au lieu de 30.
max_file_uploads = 30
